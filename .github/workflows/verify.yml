name: Offline contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: JavaScript contracts
        run: npm test
      - name: All offline Python contracts
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Artifact regeneration, syntax and commit whitespace
        run: |
          node --check src/app.js
          node --check src/research-view.js
          node --check scripts/build_meeting_brief.mjs
          node scripts/build_meeting_brief.mjs
          git diff --exit-code -- docs/meeting-brief.uk.html docs/meeting-brief.en.html
          git show --format= --check HEAD
      - name: Rebuild and inspect the offline PDF
        run: |
          python3 -m venv "$RUNNER_TEMP/signal-pdf"
          "$RUNNER_TEMP/signal-pdf/bin/pip" install reportlab==4.4.4 pypdf==6.10.2
          "$RUNNER_TEMP/signal-pdf/bin/python" scripts/build_meeting_pdf.py
          "$RUNNER_TEMP/signal-pdf/bin/python" tests/check_meeting_pdf.py
          git diff --exit-code -- docs/meeting-brief.uk.pdf
