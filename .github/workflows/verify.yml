name: Offline contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: JavaScript contracts
        run: npm test
      - name: Public research parser contracts (no live requests)
        run: python3 -m unittest discover -s tests -p test_research_pass_v1.py
      - name: Application syntax and whitespace
        run: |
          node --check src/app.js
          git diff --check
